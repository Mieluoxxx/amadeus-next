name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  dmg:
    # 原生语音助手由 swiftc 按本机架构编译，Apple Silicon 包只能在 arm64 的 macOS runner 上出。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: 校验 tag 与 package.json 版本一致
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::tag $GITHUB_REF_NAME 与 package.json 版本 $expected 不一致"
            exit 1
          fi

      - run: npm ci

      - run: npm run build

      # 没有 Developer ID 证书，关掉钥匙串自动发现，保持和本地一样的 ad-hoc 签名；
      # --publish never 防止 electron-builder 看到 tag 和 GH_TOKEN 后自己去发 release。
      - name: 打包 dmg
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --mac dmg --arm64 --publish never

      - name: 校验 dmg
        run: |
          for image in release/*.dmg; do hdiutil verify "$image"; done

      - name: 发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/*.dmg \
            --title "Amadeus Next $GITHUB_REF_NAME" \
            --generate-notes
